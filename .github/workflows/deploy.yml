# Build & Deploy. Deployment is RESTORED (v1.0, 2026-08-03).
#
# All imagery in "assets/" is original to this project (see ATTRIBUTIONS.md), so the
# deploy job removed during the art replacement is back. The published site is ONLY
# the assembled _site/ (index.html + assets/) — never the repo root. Pages must be
# configured with Source: GitHub Actions (not "Deploy from a branch"); see
# docs/GITHUB_SETUP.md Step 4.
name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 20 reached end-of-life on 2026-04-30; 22 is LTS until 2027-04-30.
          node-version: '22'

      - name: Run unit tests
        run: node --test tests/*.test.mjs

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Rebuild index.html from source
        run: python3 embed_assets.py

      - name: Verify committed index.html is in sync with the source
        run: |
          if ! git diff --quiet -- index.html; then
            echo "::error::index.html is out of sync with Space_Monkey_Elevator.html. Run 'python3 embed_assets.py' and commit the result."
            git --no-pager diff --stat -- index.html
            exit 1
          fi

      - name: Verify asset references
        run: python3 tools/check_refs.py

      - name: Assemble the published site (the game only)
        if: github.event_name != 'pull_request'
        # Publish ONLY what the game needs at runtime: the built index.html and the
        # "assets/" folder (landmark sprites and suit/gauge art load from it at
        # runtime). Source, tests, docs, screenshots, and CI config stay out of the
        # live site. The one exception is social.png: the og:image / twitter:image
        # tags in index.html point at it, so it has to exist on the published site or
        # every shared link previews a 404.
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -R assets _site/
          cp screenshots/hero.png _site/social.png

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

  smoke:
    # ADVISORY ONLY. The unit suite cannot boot the game (extract.mjs stubs the DOM), so this
    # is the only pre-deploy signal that index.html actually runs. It must never block a
    # deploy: `continue-on-error` is set and `deploy` does not list this job in `needs`.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm --prefix tests/smoke i -D playwright-core
      - run: npx --prefix tests/smoke playwright install --with-deps chromium
      - run: node tests/smoke/smoke.mjs

  deploy:
    # Only deploy on pushes to main, not on PRs.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # only the deploy job publishes; build stays read-only
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
