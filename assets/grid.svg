<?xml version="1.0" encoding="UTF-8"?>
<!-- Original art: seamless white grid tile. Replaces grid-750.webp.
     Tiled by CSS at 210px (was 750px tile -> same 70px cells on screen).
     Edge lines are drawn half-clipped so adjacent tiles complete them. -->
<svg xmlns="http://www.w3.org/2000/svg" width="750" height="750" viewBox="0 0 750 750">
    <g stroke="#ffffff" stroke-width="2">
        <path d="M 0 0 V 750 M 250 0 V 750 M 500 0 V 750 M 750 0 V 750"/>
        <path d="M 0 0 H 750 M 0 250 H 750 M 0 500 H 750 M 0 750 H 750"/>
    </g>
</svg>
