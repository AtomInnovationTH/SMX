# Build only. DEPLOYMENT IS DISABLED.
#
# The `deploy` job and the Pages publish steps were removed deliberately: the imagery in
# "Space Elevator_files/" is not licensed for redistribution (see the artwork warning in
# README.md :113). Deploying the site republishes those assets. Restore the `deploy` job
# and re-enable Pages in Settings once the original-art greenfield lands
# (docs/v1.0-roadmap.md Phase 0). Until then this workflow only tests and verifies that
# the committed index.html matches its source.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run unit tests
        run: node --test tests/*.test.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Rebuild index.html from source
        run: python3 embed_assets.py

      - name: Verify committed index.html is in sync with the source
        run: |
          if ! git diff --quiet -- index.html; then
            echo "::error::index.html is out of sync with Space_Monkey_Elevator.html. Run 'python3 embed_assets.py' and commit the result."
            git --no-pager diff --stat -- index.html
            exit 1
          fi
