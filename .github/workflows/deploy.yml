name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run unit tests
        run: node --test tests/*.test.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Rebuild index.html from source
        run: python3 embed_assets.py

      - name: Verify committed index.html is in sync with the source
        run: |
          if ! git diff --quiet -- index.html; then
            echo "::error::index.html is out of sync with Space_Monkey_Elevator.html. Run 'python3 embed_assets.py' and commit the result."
            git --no-pager diff --stat -- index.html
            exit 1
          fi

      - name: Assemble the published site (the game only)
        if: github.event_name != 'pull_request'
        # Publish ONLY what the game needs at runtime: the built index.html and the
        # "Space Elevator_files/" folder (landmark sprites load from it at runtime).
        # Source, tests, docs, screenshots, and CI config stay out of the live site.
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -R "Space Elevator_files" _site/

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    # Only deploy on pushes to main, not on PRs.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
